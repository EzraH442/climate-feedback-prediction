base: ../../base/model/common.yaml

dataset:
  input_vars:
    - skt
    - hcc
    - mcc
    - lcc
    - sp
    - tciw
    - tclw
    - tcwv
    - ecod
  clear_sky_zero_vars:
    - hcc
    - mcc
    - lcc
    - tciw
    - tclw
    - ecod
  input_var: "skt"
  target_var: "ttr"
  era5:
    path: './data/ts/era5_processed'
  kernels:
    raw_path: "./data/ts/kernels"
    path: './data/ts/kernels_processed'

preprocess:
  params_dir: 'preprocess_states/ts/baseline'
  ecod:
    enabled: True
    method: "true"

optimizer:
  scheduler:
    type: cosine_annealing
    t_max: 100
    eta_min: 1.0e-6

model:
  input_dim: 9
  hidden_dim_sizes:
    - 11

train:
  name: "1990-2020_1-12_baseline_cos"
  checkpoint_dir: "./checkpoints/ts/1990-2020_1-12_baseline_cos"
  sobolev: False
  sobolev_vars: []
