base: ../../../base/model/common.yaml

dataset:
  input_vars:
    - skt
    - hcc
    - mcc
    - lcc
    - sp
    - tciw
    - tclw
    - tcwv
    - tisr
    - ecod
  clear_sky_zero_vars:
    - hcc
    - mcc
    - lcc
    - tciw
    - tclw
    - ecod
  input_var: "skt"
  target_var: "ttr"
  era5:
    path: './data/ts/era5_processed'
  kernels:
    raw_path: "./data/ts/kernels"
    path: './data/ts/kernels_processed'

preprocess:
  params_dir: 'preprocess_states/ts/baseline'
  ecod:
    enabled: True
    method: "true"

model:
  input_dim: 10
  hidden_dim_sizes:
    - 11
    - 11
    - 8

train:
  name: "1990-2020_1-12_baseline_deep"
  checkpoint_dir: "./checkpoints/ts/deep/1990-2020_1-12_baseline_deep"
  sobolev: False
  sobolev_vars: []
