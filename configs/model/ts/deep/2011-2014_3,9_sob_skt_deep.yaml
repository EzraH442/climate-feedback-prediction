base: ../../../base/model/common.yaml

dataset:
  input_vars:
    - skt
    - hcc
    - mcc
    - lcc
    - sp
    - tciw
    - tclw
    - tcwv
    - tisr
    - ecod
  clear_sky_zero_vars:
    - hcc
    - mcc
    - lcc
    - tciw
    - tclw
    - ecod
  input_var: "skt"
  target_var: "ttr"
  months:
    - 3
    - 9
  era5:
    path: "./data/ts/era5_processed_mar_sep_2011_2014"
  kernels:
    raw_path: "./data/ts/kernels"
    path: "./data/ts/kernels_processed_mar_sep_2011_2014"
  train_years:
    - 2011
    - 2012
    - 2013
    - 2014
  val_years:
    - 2015
  test_years:
    - 2015

preprocess:
  params_dir: "preprocess_states/ts/baseline_mar_sep_2011_2014"
  ecod:
    enabled: True
    method: "true"

model:
  input_dim: 10
  hidden_dim_sizes:
    - 11
    - 11
    - 8

train:
  name: "2011-2014_3,9_sob_skt_deep"
  checkpoint_dir: "./checkpoints/ts/deep/2011-2014_3,9_sob_skt_deep"
  sobolev: True
  sobolev_vars:
    - skt
  sobolev_alpha: 0.5
