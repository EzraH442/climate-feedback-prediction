base: ../../base/model/common.yaml

dataset:
  era5:
    path: './data/fal/era5_processed'
  kernels:
    path: './data/fal/kernels_processed'

preprocess:
  params_dir: 'preprocess_states/fal/baseline'
  ecod: True

optimizer:
  scheduler:
    type: cosine_annealing
    t_max: 100
    eta_min: 1.0e-6

model:
  input_dim: 12
  hidden_dim_sizes:
    - 11

train:
  name: "baseline_cos"
  checkpoint_dir: './checkpoints/fal/baseline_cosine_annealing'
  sobolev: False
