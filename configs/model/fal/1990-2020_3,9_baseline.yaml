base: ../../base/model/common.yaml

dataset:
  input_vars:
    - fal
    - hcc
    - mcc
    - lcc
    - sp
    - tciw
    - tclw
    - tcwv
    - tco3
    - tisr
    - ecod
    - ecod_fal
  clear_sky_zero_vars:
    - hcc
    - mcc
    - lcc
    - tciw
    - tclw
    - ecod
    - ecod_fal
  months:
    - 3
    - 9
  era5:
    path: "./data/fal/era5_processed_mar_sep"
  kernels:
    raw_path: "./data/fal/kernels"
    path: "./data/fal/kernels_processed_mar_sep"

preprocess:
  params_dir: "preprocess_states/fal/baseline_mar_sep"
  ecod:
    enabled: True
    method: "true"

model:
  input_dim: 12
  hidden_dim_sizes:
    - 11

train:
  name: "1990-2020_3,9_baseline"
  checkpoint_dir: "./checkpoints/fal/1990-2020_3,9_baseline"
  sobolev: False
  sobolev_vars: []
