base: ../../base/model/common.yaml

dataset:
  input_vars:
    - fal
    - hcc
    - mcc
    - lcc
    - sp
    - tciw
    - tclw
    - tcwv
    - tco3
    - tisr
    - ecod
    - ecod_fal
  kernel_vars:
    - fal
    - tcwv
  sky: ['all', 'clear']
  months: [3, 6, 9, 12]
  era5:
    path: './data/fal/era5_processed_mar_june_sep_dec_2011_2014_clearsky'
  kernels:
    raw_path: './data/fal/kernels'
    path: './data/fal/kernels_processed_mar_june_sep_dec_2011_2014_clearsky'
  train_years: [2011, 2012, 2013, 2014]
  val_years: [2015]
  test_years: [2015]

preprocess:
  params_dir: 'preprocess_states/fal/2011-2014_3,6,9,12_clearsky'
  ecod:
    enabled: True
    method: 'true'

model:
  input_dim: 12
  hidden_dim_sizes: [11]

train:
  name: '2011-2014_3,6,9,12_sob_fal_tcwv_clearsky_muon_reduce-lr-on-plateau'
  checkpoint_dir: './checkpoints/fal/2011-2014_3,6,9,12_sob_fal_tcwv_clearsky_muon_reduce-lr-on-plateau'
  sobolev: True
  sobolev_vars: ['fal', 'tcwv']
  sobolev_alpha: 0.5

optimizer:
  scheduler:
    type: reduce_lr_on_plateau
    factor: 0.1
    patience: 3
    threshold: 0.0001
    min_lr: 0.00001
  muon:
    learning_rate: 0.01
