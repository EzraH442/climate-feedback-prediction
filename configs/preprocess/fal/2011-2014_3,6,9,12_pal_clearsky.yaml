base: ../../base/preprocess/common.yaml

dataset:
  input_vars:
    - fal
    - hcc
    - mcc
    - lcc
    - sp
    - tciw
    - tclw
    - tcwv
    - tco3
    - tisr
    - ecod
    - ecod_fal
  target_var: pal
  clear_sky_var: palc
  kernel_vars: ['fal', 'tcwv']
  sky: ['all', 'clear']
  months: [3, 6, 9, 12]
  era5:
    path: './data/fal/era5_processed_mar_june_sep_dec_2011_2014_pal_clearsky'
  kernels:
    raw_path: './data/fal/kernels'
    path: './data/fal/kernels_processed_mar_june_sep_dec_2011_2014_pal_clearsky'
  train_years: [2011, 2012, 2013, 2014]
  val_years: [2015]

preprocess:
  params_dir: 'preprocess_states/fal/2011-2014_3,6,9,12_pal_clearsky'
  ecod:
    enabled: True
    method: 'true'
