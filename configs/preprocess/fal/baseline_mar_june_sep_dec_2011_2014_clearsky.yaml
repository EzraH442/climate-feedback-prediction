base: ../../base/preprocess/common.yaml

dataset:
  input_vars:
    - fal
    - hcc
    - mcc
    - lcc
    - sp
    - tciw
    - tclw
    - tcwv
    - tisr
    - ecod
    - ecod_fal
  clear_sky_zero_vars:
    - hcc
    - mcc
    - lcc
    - tciw
    - tclw
    - ecod
    - ecod_fal
  clear_sky_training:
    enabled: True
    output_var: "tsrc"
  months:
