    - 6
    - 9
    - 12
  era5:
    path: "./data/fal/era5_processed_mar_june_sep_dec_2011_2014_clearsky"
  kernels:
    raw_path: "./data/fal/kernels"
    path: "./data/fal/kernels_processed_mar_june_sep_dec_2011_2014_clearsky"
  train_years:
    - 2011
    - 2012
    - 2013
    - 2014
  val_years:
    - 2015

preprocess:
  params_dir: "preprocess_states/fal/baseline_mar_june_sep_dec_2011_2014_clearsky"
  ecod:
    enabled: True
    method: "true"
